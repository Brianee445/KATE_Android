name: Kate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4

      # ==================== SETUP ====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      # ==================== CACHE ====================
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/android/sdk/ndk
            ~/android/sdk/cmake
          key: ${{ runner.os }}-android-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/vosk-model
          key: ${{ runner.os }}-vosk-model-v1
          restore-keys: |
            ${{ runner.os }}-vosk-model-

      # ==================== DOWNLOAD VOSK MODEL ====================
      - name: Download Vosk model (if not cached)
        run: |
          if [ ! -d "app/src/main/assets/vosk-model" ]; then
            echo "📥 Downloading Vosk model..."
            mkdir -p app/src/main/assets
            curl -L -o /tmp/vosk-model.zip \
              "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
            unzip -q /tmp/vosk-model.zip -d app/src/main/assets/
            mv app/src/main/assets/vosk-model-small-en-us-0.15 app/src/main/assets/vosk-model
            echo "✅ Vosk model downloaded"
          else
            echo "✅ Vosk model already cached"
          fi
          echo "📁 Vosk model size: $(du -sh app/src/main/assets/vosk-model | cut -f1)"

      # ==================== DOWNLOAD THIRD-PARTY LIBS ====================
      - name: Download third-party libraries (if script exists)
        run: |
          if [ -f "scripts/download_third_party.sh" ]; then
            chmod +x scripts/download_third_party.sh
            ./scripts/download_third_party.sh || echo "⚠️ Third-party script failed, continuing..."
          else
            echo "ℹ️ No third-party download script found"
          fi

      # ==================== LINT ====================
      - name: Run lint
        run: ./gradlew lint

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results*.html

      # ==================== TESTS ====================
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # ==================== KOTLIN COMPILER CHECK ====================
      - name: Run Kotlin compiler checks
        run: ./gradlew compileDebugKotlin

      # ==================== BUILD DEBUG APK ====================
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # ==================== VERIFY NATIVE LIBRARIES ====================
      - name: Verify native library packaging
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "✅ APK found: $APK"
            echo "📏 APK size: $(du -h $APK | cut -f1)"
            
            echo "=== LIB FOLDERS ==="
            unzip -l $APK | grep "lib/" || echo "No lib folders found"
            
            echo "=== .SO FILE INFO ==="
            unzip -l $APK | grep "\.so" || echo "No .so files found"
          else
            echo "❌ APK not found at $APK"
            exit 1
          fi

      # ==================== VERIFY VOSK IN APK ====================
      - name: Verify Vosk model in APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== CHECKING FOR VOSK MODEL ==="
          unzip -l $APK | grep "assets/vosk-model" || echo "⚠️ Vosk model not in APK"
          # Count files in model
          FILES_COUNT=$(unzip -l $APK | grep "assets/vosk-model/" | wc -l)
          echo "📊 Vosk model files in APK: $FILES_COUNT"

      # ==================== UPLOAD ARTIFACTS ====================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/
            ~/.gradle/daemon/*/daemon-*.out.log

      # ==================== BUILD SUMMARY ====================
      - name: Build Summary
        if: always()
        run: |
          echo "## 🏗️ CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Lint
          if [ -f "app/build/reports/lint-results-debug.html" ]; then
            echo "| Lint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lint | ⚠️ See report |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Tests
          if [ -d "app/build/reports/tests/testDebugUnitTest" ]; then
            echo "| Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | ⚠️ See report |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # APK
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "| Debug APK | ✅ Built ($SIZE) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Debug APK | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Vosk model
          if [ -d "app/src/main/assets/vosk-model" ]; then
            MODEL_SIZE=$(du -sh app/src/main/assets/vosk-model | cut -f1)
            echo "| Vosk Model | ✅ Included ($MODEL_SIZE) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Vosk Model | ⚠️ Not found |" >> $GITHUB_STEP_SUMMARY
          fi
