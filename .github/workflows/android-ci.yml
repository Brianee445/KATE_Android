name: Kate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4

      # ==================== SETUP ====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      # ==================== GENERATE AVATARS ====================
      - name: Generate Kate Avatars
        run: |
          echo "🎨 Generating Kate avatars from source..."
          
          # Install Pillow for image processing
          pip install pillow
          
          # Run the avatar generator
          python scripts/generate_kate_avatars.py
          
          echo "✅ Avatars generated successfully!"
          
          # Show what was generated
          echo "📁 Generated avatar files:"
          find app/src/main/res -name "kate_avatar_*.png" | head -10

      # ==================== CACHE ====================
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ==================== LINT ====================
      - name: Run lint
        run: ./gradlew lint

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results*.html

      # ==================== TESTS ====================
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # ==================== BUILD DEBUG APK ====================
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # ==================== VERIFY ASSETS ====================
      - name: Verify avatar generation
        run: |
          echo "🔍 Verifying avatar assets in APK..."
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "✅ APK found"
            echo "📊 Avatar files in APK:"
            unzip -l $APK | grep "kate_avatar" || echo "⚠️ No avatar files found!"
          fi

      # ==================== UPLOAD APK ====================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # ==================== BUILD SUMMARY ====================
      - name: Build Summary
        if: always()
        run: |
          echo "## 🏗️ CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Avatars
          if [ -d "app/src/main/res/drawable-xxhdpi" ]; then
            COUNT=$(find app/src/main/res -name "kate_avatar_*.png" | wc -l)
            echo "| Avatars | ✅ Generated ($COUNT files) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Avatars | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Lint
          if [ -f "app/build/reports/lint-results-debug.html" ]; then
            echo "| Lint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lint | ⚠️ See report |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Tests
          if [ -d "app/build/reports/tests/testDebugUnitTest" ]; then
            echo "| Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | ⚠️ See report |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # APK
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "| Debug APK | ✅ Built ($SIZE) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Debug APK | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
