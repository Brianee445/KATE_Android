name: Kate Release
 
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      # ==================== DOWNLOAD VOSK LIBRARIES (FIXED) ====================
      - name: Download Vosk libraries
        run: |
          echo "📥 Downloading Vosk libraries..."
          
          # Create directories
          mkdir -p app/src/main/cpp/third_party/vosk/lib/arm64-v8a
          mkdir -p app/src/main/cpp/third_party/vosk/lib/armeabi-v7a
          mkdir -p app/src/main/cpp/third_party/vosk/include
          
          # Download Vosk (-f = fail the step on HTTP errors instead of saving an error page as the zip)
          curl -fL -o /tmp/vosk.zip "https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-android-0.3.45.zip"
          unzip -q /tmp/vosk.zip -d /tmp/vosk/

          echo "📂 Actual extracted structure (verify this matches the paths below):"
          find /tmp/vosk -maxdepth 3 -type f

          # Locate libvosk.so wherever it actually landed, per ABI folder name
          ARM64_SRC=$(find /tmp/vosk -type f -name "libvosk.so" -path "*aarch64*" -o -type f -name "libvosk.so" -path "*arm64-v8a*" | head -n1)
          ARMV7_SRC=$(find /tmp/vosk -type f -name "libvosk.so" -path "*armeabi-v7a*" | head -n1)

          if [ -z "$ARM64_SRC" ]; then
            echo "❌ Could not locate arm64 libvosk.so anywhere in the extracted zip."
            echo "   Check the 'Actual extracted structure' output above and fix the path."
            exit 1
          fi
          cp "$ARM64_SRC" app/src/main/cpp/third_party/vosk/lib/arm64-v8a/libvosk.so
          echo "  ✅ arm64-v8a: $ARM64_SRC"

          if [ -n "$ARMV7_SRC" ]; then
            cp "$ARMV7_SRC" app/src/main/cpp/third_party/vosk/lib/armeabi-v7a/libvosk.so
            echo "  ✅ armeabi-v7a: $ARMV7_SRC"
          else
            echo "⚠️ armeabi-v7a libvosk.so not found (ok if you don't ship that ABI)"
          fi

          HEADER_SRC=$(find /tmp/vosk -type f -name "vosk_api.h" | head -n1)
          if [ -n "$HEADER_SRC" ]; then
            cp "$HEADER_SRC" app/src/main/cpp/third_party/vosk/include/
            echo "  ✅ Header: $HEADER_SRC"
          fi

          # Hard verification - fail the build now with a clear message rather than
          # letting CMake silently write a "placeholder" text file and fail later at link time
          echo ""
          echo "📁 Verification:"
          for f in app/src/main/cpp/third_party/vosk/lib/arm64-v8a/libvosk.so; do
            if [ ! -s "$f" ]; then
              echo "❌ $f is missing or empty. Aborting before the Gradle build starts."
              exit 1
            fi
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -lt 100000 ]; then
              echo "❌ $f is only $SIZE bytes — that's not a real libvosk.so (expected several MB). Aborting."
              exit 1
            fi
            echo "  ✅ $f ($SIZE bytes)"
          done

      # ==================== DOWNLOAD THIRD-PARTY LIBS (TFLite + JSON) ====================
      - name: Download third-party libraries
        run: |
          if [ -f "scripts/download_third_party.sh" ]; then
            chmod +x scripts/download_third_party.sh
            ./scripts/download_third_party.sh
          else
            echo "⚠️ Third-party script not found, creating placeholder..."
            mkdir -p app/src/main/cpp/third_party/tflite/lib/arm64-v8a
            mkdir -p app/src/main/cpp/third_party/tflite/lib/armeabi-v7a
            touch app/src/main/cpp/third_party/tflite/lib/arm64-v8a/libtensorflowlite_c.so
            touch app/src/main/cpp/third_party/tflite/lib/armeabi-v7a/libtensorflowlite_c.so
          fi

      # ==================== GENERATE AVATARS ====================
      - name: Generate Kate Avatars
        run: |
          if [ -f "scripts/generate_kate_avatars.py" ] && [ -f "app/src/main/res/source/kate_avatar_source.png" ]; then
            echo "🎨 Generating Kate avatars..."
            pip install pillow
            python scripts/generate_kate_avatars.py
            echo "✅ Avatars generated!"
          else
            echo "⚠️ Avatar script or source not found, skipping..."
          fi

      # ==================== DECODE KEYSTORE ====================
      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > $GITHUB_WORKSPACE/kate.jks
          echo "Keystore decoded successfully"

      # ==================== GRADLE PERMISSIONS ====================
      - name: Grant execute permission
        run: chmod +x gradlew

      # ==================== DOWNLOAD VOSK MODEL (for assets) ====================
      - name: Download Vosk model for CI build
        run: |
          mkdir -p app/src/main/assets
          if [ ! -d "app/src/main/assets/vosk-model" ]; then
            # 0.22-lgraph over the old 2020 daanzu model - similar size,
            # meaningfully lower WER. See VoskManager.MODEL_NAME.
            curl -fL -o /tmp/vosk-model.zip \
              "https://alphacephei.com/vosk/models/vosk-model-en-us-0.22-lgraph.zip"
            unzip -q /tmp/vosk-model.zip -d app/src/main/assets/
            mv app/src/main/assets/vosk-model-en-us-0.22-lgraph app/src/main/assets/vosk-model
            if [ ! -d "app/src/main/assets/vosk-model/am" ] || [ ! -d "app/src/main/assets/vosk-model/conf" ]; then
              echo "❌ Vosk model missing am/ or conf/ after extraction - aborting."
              exit 1
            fi
            echo "✅ Vosk model (0.22-lgraph) downloaded to assets"
          else
            echo "Vosk model already exists"
          fi

      # ==================== BUILD APK & AAB ====================
      - name: Build & sign release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build & sign release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # ==================== VERIFY ====================
      - name: Verify artifacts
        run: |
          echo "=== APK(s) ==="
          ls -la app/build/outputs/apk/release/ || echo "APK not found"
          echo "=== AAB ==="
          ls -la app/build/outputs/bundle/release/ || echo "AAB not found"
          echo "=== Native libraries per APK ==="
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "--- $apk ---"
            unzip -l "$apk" | grep "\.so" || echo "No .so files found in $apk"
          done

      # ==================== UPLOAD ====================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ==================== CREATE RELEASE ====================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
