name: Kate Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      # ==================== DOWNLOAD VOSK LIBRARIES (FIXED) ====================
      - name: Download Vosk libraries
        run: |
          echo "📥 Downloading Vosk libraries..."
          
          # Create directories
          mkdir -p app/src/main/cpp/third_party/vosk/lib/arm64-v8a
          mkdir -p app/src/main/cpp/third_party/vosk/lib/armeabi-v7a
          mkdir -p app/src/main/cpp/third_party/vosk/include
          
          # Download Vosk
          curl -L -o /tmp/vosk.zip "https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-android-0.3.45.zip"
          unzip -q /tmp/vosk.zip -d /tmp/vosk/
          
          # The zip structure is: aarch64/, armeabi-v7a/, x86_64/, x86/
          # Copy from the correct paths
          if [ -f "/tmp/vosk/aarch64/libvosk.so" ]; then
            cp /tmp/vosk/aarch64/libvosk.so app/src/main/cpp/third_party/vosk/lib/arm64-v8a/
            echo "  ✅ arm64-v8a: /tmp/vosk/aarch64/libvosk.so"
          fi
          
          if [ -f "/tmp/vosk/armeabi-v7a/libvosk.so" ]; then
            cp /tmp/vosk/armeabi-v7a/libvosk.so app/src/main/cpp/third_party/vosk/lib/armeabi-v7a/
            echo "  ✅ armeabi-v7a: /tmp/vosk/armeabi-v7a/libvosk.so"
          fi
          
          # Copy header
          if [ -f "/tmp/vosk/src/vosk_api.h" ]; then
            cp /tmp/vosk/src/vosk_api.h app/src/main/cpp/third_party/vosk/include/
            echo "  ✅ Header: /tmp/vosk/src/vosk_api.h"
          fi
          
          # Verify files exist
          echo ""
          echo "📁 Verification:"
          ls -la app/src/main/cpp/third_party/vosk/lib/arm64-v8a/ || echo "  ⚠️ arm64-v8a directory empty"
          ls -la app/src/main/cpp/third_party/vosk/lib/armeabi-v7a/ || echo "  ⚠️ armeabi-v7a directory empty"
          ls -la app/src/main/cpp/third_party/vosk/include/ || echo "  ⚠️ include directory empty"

      # ==================== DOWNLOAD THIRD-PARTY LIBS (TFLite + JSON) ====================
      - name: Download third-party libraries
        run: |
          if [ -f "scripts/download_third_party.sh" ]; then
            chmod +x scripts/download_third_party.sh
            ./scripts/download_third_party.sh
          else
            echo "⚠️ Third-party script not found, creating placeholder..."
            mkdir -p app/src/main/cpp/third_party/tflite/lib/arm64-v8a
            mkdir -p app/src/main/cpp/third_party/tflite/lib/armeabi-v7a
            touch app/src/main/cpp/third_party/tflite/lib/arm64-v8a/libtensorflowlite_c.so
            touch app/src/main/cpp/third_party/tflite/lib/armeabi-v7a/libtensorflowlite_c.so
          fi

      # ==================== GENERATE AVATARS ====================
      - name: Generate Kate Avatars
        run: |
          if [ -f "scripts/generate_kate_avatars.py" ] && [ -f "app/src/main/res/source/kate_avatar_source.png" ]; then
            echo "🎨 Generating Kate avatars..."
            pip install pillow
            python scripts/generate_kate_avatars.py
            echo "✅ Avatars generated!"
          else
            echo "⚠️ Avatar script or source not found, skipping..."
          fi

      # ==================== DECODE KEYSTORE ====================
      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > $GITHUB_WORKSPACE/kate.jks
          echo "Keystore decoded successfully"

      # ==================== GRADLE PERMISSIONS ====================
      - name: Grant execute permission
        run: chmod +x gradlew

      # ==================== DOWNLOAD VOSK MODEL (for assets) ====================
      - name: Download Vosk model for CI build
        run: |
          mkdir -p app/src/main/assets
          if [ ! -d "app/src/main/assets/vosk-model" ]; then
            curl -L -o /tmp/vosk-model.zip \
              "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
            unzip -q /tmp/vosk-model.zip -d app/src/main/assets/
            mv app/src/main/assets/vosk-model-small-en-us-0.15 app/src/main/assets/vosk-model
            echo "Vosk model downloaded to assets"
          else
            echo "Vosk model already exists"
          fi

      # ==================== BUILD APK & AAB ====================
      - name: Build & sign release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build & sign release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # ==================== VERIFY ====================
      - name: Verify artifacts
        run: |
          echo "=== APK ==="
          ls -la app/build/outputs/apk/release/ || echo "APK not found"
          echo "=== AAB ==="
          ls -la app/build/outputs/bundle/release/ || echo "AAB not found"
          echo "=== Native libraries in APK ==="
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            unzip -l app/build/outputs/apk/release/app-release.apk | grep "\.so" | head -10 || echo "No .so files found"
          fi

      # ==================== UPLOAD ====================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ==================== CREATE RELEASE ====================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
