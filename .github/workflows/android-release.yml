name: Kate Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > $GITHUB_WORKSPACE/kate.jks
  
      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build & sign release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify native library architecture
        run: |
          APK=app/build/outputs/apk/release/*.apk
          echo "=== LIB FOLDERS ==="
          unzip -l $APK | grep "lib/"
          echo "=== .SO FILE INFO ==="
          unzip -o $APK "lib/*" -d /tmp/apk_check
          file /tmp/apk_check/lib/arm64-v8a/libkate_core.so

       - name: Verify APK signing and alignment
         run: |
          APK=app/build/outputs/apk/release/*.apk
          echo "=== ZIPALIGN CHECK ==="
          $ANDROID_HOME/build-tools/34.0.0/zipalign -c -v 4 $APK
          echo "=== SIGNATURE CHECK ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose $APK
          echo "=== MANIFEST CHECK ==="
          unzip -p $APK AndroidManifest.xml | strings | grep -E "min|target|package|extract"
    
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-signed
          path: app/build/outputs/apk/release/*.apk
