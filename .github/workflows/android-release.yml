name: Kate Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      # ==================== DOWNLOAD VOSK LIBRARIES (pulled from the real Maven Central AAR) ====================
      - name: Download Vosk libraries
        run: |
          set -e
          echo "📥 Downloading Vosk native libraries from Maven Central..."

          mkdir -p app/src/main/cpp/third_party/vosk/lib/arm64-v8a
          mkdir -p app/src/main/cpp/third_party/vosk/lib/armeabi-v7a
          mkdir -p app/src/main/cpp/third_party/vosk/include

          VOSK_VERSION="0.3.75"
          AAR_URL="https://repo1.maven.org/maven2/com/alphacephei/vosk-android/${VOSK_VERSION}/vosk-android-${VOSK_VERSION}.aar"

          curl -fL -o /tmp/vosk-android.aar "$AAR_URL"
          mkdir -p /tmp/vosk-aar
          unzip -q /tmp/vosk-android.aar -d /tmp/vosk-aar/

          echo "📁 AAR contents (jni folder):"
          find /tmp/vosk-aar/jni -type f 2>/dev/null || echo "  ⚠️ No jni folder found in AAR"

          if [ -f "/tmp/vosk-aar/jni/arm64-v8a/libvosk.so" ]; then
            cp /tmp/vosk-aar/jni/arm64-v8a/libvosk.so app/src/main/cpp/third_party/vosk/lib/arm64-v8a/
            echo "  ✅ arm64-v8a libvosk.so copied"
          else
            echo "  ❌ arm64-v8a/libvosk.so not found in AAR"
            exit 1
          fi

          if [ -f "/tmp/vosk-aar/jni/armeabi-v7a/libvosk.so" ]; then
            cp /tmp/vosk-aar/jni/armeabi-v7a/libvosk.so app/src/main/cpp/third_party/vosk/lib/armeabi-v7a/
            echo "  ✅ armeabi-v7a libvosk.so copied"
          else
            echo "  ❌ armeabi-v7a/libvosk.so not found in AAR"
            exit 1
          fi

          # vosk_api.h isn't bundled in the AAR (Java/Kotlin consumers don't
          # need the C header) - fetch it directly from the vosk-api source repo.
          curl -fL -o app/src/main/cpp/third_party/vosk/include/vosk_api.h \
            "https://raw.githubusercontent.com/alphacep/vosk-api/v${VOSK_VERSION}/src/vosk_api.h"

          echo ""
          echo "📁 Final verification:"
          ls -la app/src/main/cpp/third_party/vosk/lib/arm64-v8a/
          ls -la app/src/main/cpp/third_party/vosk/lib/armeabi-v7a/
          ls -la app/src/main/cpp/third_party/vosk/include/

      # ==================== DOWNLOAD THIRD-PARTY LIBS (TFLite + JSON) ====================
      - name: Download third-party libraries
        run: |
          if [ -f "scripts/download_third_party.sh" ]; then
            chmod +x scripts/download_third_party.sh
            ./scripts/download_third_party.sh
          else
            echo "⚠️ Third-party script not found, creating placeholder..."
            mkdir -p app/src/main/cpp/third_party/tflite/lib/arm64-v8a
            mkdir -p app/src/main/cpp/third_party/tflite/lib/armeabi-v7a
            touch app/src/main/cpp/third_party/tflite/lib/arm64-v8a/libtensorflowlite_c.so
            touch app/src/main/cpp/third_party/tflite/lib/armeabi-v7a/libtensorflowlite_c.so
          fi

      # ==================== GENERATE AVATARS ====================
      - name: Generate Kate Avatars
        run: |
          if [ -f "scripts/generate_kate_avatars.py" ] && [ -f "app/src/main/res/source/kate_avatar_source.png" ]; then
            echo "🎨 Generating Kate avatars..."
            pip install pillow
            python scripts/generate_kate_avatars.py
            echo "✅ Avatars generated!"
          else
            echo "⚠️ Avatar script or source not found, skipping..."
          fi

      # ==================== DECODE KEYSTORE ====================
      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > $GITHUB_WORKSPACE/kate.jks
          echo "Keystore decoded successfully"

      # ==================== GRADLE PERMISSIONS ====================
      - name: Grant execute permission
        run: chmod +x gradlew

      # ==================== DOWNLOAD VOSK MODEL (for assets) ====================
      - name: Download Vosk model for CI build
        run: |
          mkdir -p app/src/main/assets
          if [ ! -d "app/src/main/assets/vosk-model" ]; then
            curl -L -o /tmp/vosk-model.zip \
              "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
            unzip -q /tmp/vosk-model.zip -d app/src/main/assets/
            mv app/src/main/assets/vosk-model-small-en-us-0.15 app/src/main/assets/vosk-model
            echo "Vosk model downloaded to assets"
          else
            echo "Vosk model already exists"
          fi

      # ==================== BUILD APK & AAB ====================
      - name: Build & sign release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build & sign release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # ==================== VERIFY ====================
      - name: Verify artifacts
        run: |
          echo "=== APK(s) ==="
          ls -la app/build/outputs/apk/release/ || echo "APK not found"
          echo "=== AAB ==="
          ls -la app/build/outputs/bundle/release/ || echo "AAB not found"
          echo "=== Native libraries per APK ==="
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "--- $apk ---"
            unzip -l "$apk" | grep "\.so" || echo "No .so files found in $apk"
          done

      # ==================== UPLOAD ====================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ==================== CREATE RELEASE ====================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
