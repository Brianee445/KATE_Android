name: Kate Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ==================== GENERATE AVATARS ====================
      - name: Generate Kate Avatars
        run: |
          if [ -f "scripts/generate_kate_avatars.py" ] && [ -f "app/src/main/res/source/kate_avatar_source.png" ]; then
            echo "🎨 Generating Kate avatars..."
            pip install pillow
            python scripts/generate_kate_avatars.py
            echo "✅ Avatars generated!"
          else
            echo "⚠️ Avatar script or source not found, skipping..."
          fi

      # ==================== DECODE KEYSTORE ====================
      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > $GITHUB_WORKSPACE/kate.jks
          echo "Keystore decoded successfully"

      # ==================== GRADLE PERMISSIONS ====================
      - name: Grant execute permission
        run: chmod +x gradlew

      # ==================== BUILD APK & AAB ====================
      - name: Build & sign release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build & sign release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # ==================== VERIFY ====================
      - name: Verify artifacts
        run: |
          echo "=== APK(s) ==="
          ls -la app/build/outputs/apk/release/ || echo "APK not found"
          echo "=== AAB ==="
          ls -la app/build/outputs/bundle/release/ || echo "AAB not found"
          echo "=== Native libraries per APK ==="
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "--- $apk ---"
            unzip -l "$apk" | grep "\.so" || echo "No .so files found in $apk"
          done

      # ==================== DIAGNOSTIC: LAUNCHER ICON ====================
      # Temporary - remove once the launcher icon issue is confirmed fixed.
      # Answers definitively what aapt/badging thinks android:icon resolves
      # to and whether the adaptive-icon resource chain actually compiled
      # in, rather than guessing from source files alone.
      - name: Diagnose launcher icon resolution
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAPT2=$(find "$ANDROID_HOME" -name "aapt2" -type f 2>/dev/null | sort -V | tail -n1)
          if [ -z "$AAPT2" ]; then
            echo "❌ aapt2 not found under \$ANDROID_HOME ($ANDROID_HOME) - can't run this diagnostic"
            find "$ANDROID_HOME" -iname "aapt2" 2>/dev/null
          else
            echo "Using aapt2 at: $AAPT2"
            echo ""
            echo "=== badging (icon path as resolved by the manifest) ==="
            "$AAPT2" dump badging "$APK" | grep -i "application-icon\|launchable-activity" || echo "no icon lines found in badging output"
            echo ""
            echo "=== manifest xmltree: application/activity icon attributes ==="
            "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -B2 -A2 -i "icon"
            echo ""
            echo "=== resources: ic_launcher entries ==="
            "$AAPT2" dump resources "$APK" | grep -A3 -i "ic_launcher\b\|ic_launcher_round\|ic_launcher_foreground\|ic_launcher_background"
          fi

      # ==================== UPLOAD ====================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ==================== CREATE RELEASE ====================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
