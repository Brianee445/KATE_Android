# gradle/libs.versions.toml
# Kate Android - Complete Version Catalog

[versions]
# ==================== ANDROID ====================
agp                = "8.7.2"
kotlin             = "2.0.21"
core-ktx           = "1.15.0"
activity-compose   = "1.9.3"
lifecycle          = "2.8.7"

# ==================== COMPOSE ====================
compose-bom        = "2024.12.01"
navigation         = "2.8.4"
material3          = "1.3.1"
accompanist        = "0.36.0"

# ==================== HILT ====================
hilt               = "2.52"

# ==================== COROUTINES ====================
coroutines         = "1.8.1"

# ==================== ROOM ====================
room               = "2.6.1"

# ==================== DATASTORE ====================
datastore          = "1.1.1"

# ==================== NETWORKING ====================
retrofit           = "2.11.0"
okhttp             = "4.12.0"

# ==================== SUPABASE ====================
supabase           = "3.1.2"

# ==================== ML / AI ====================
vosk               = "0.3.75"
jna                = "5.18.1"
tensorflow-lite    = "2.17.0"
# NOTE: tensorflow-lite-support uses its own independent version scheme —
# it never had a "2.17.0" release (that's the tensorflow-lite core scheme).
# Latest available is 0.5.0. Also note this artifact is deprecated upstream,
# relocated to com.google.ai.edge.litert:litert-support — fine to keep using
# 0.5.0 for now, migrate later on its own.
tensorflow-lite-support = "0.5.0"

# ==================== IMAGE LOADING ====================
coil               = "3.0.4"

# ==================== TESTING ====================
junit              = "4.13.2"
androidx-test      = "1.6.1"
espresso           = "3.6.1"

# ==================== OTHER ====================
security-crypto    = "1.1.0-alpha06"

[libraries]
# ==================== ANDROID ====================
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# ==================== COMPOSE ====================
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# ==================== HILT ====================
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# ==================== COROUTINES ====================
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# ==================== ROOM ====================
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ==================== DATASTORE ====================
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ==================== SECURITY ====================
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# ==================== NETWORKING ====================
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
retrofit-rxjava = { group = "com.squareup.retrofit2", name = "adapter-rxjava3", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version = "2.11.0" }

# ==================== SUPABASE ====================
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt", version.ref = "supabase" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt", version.ref = "supabase" }
supabase-realtime = { group = "io.github.jan-tennert.supabase", name = "realtime-kt", version.ref = "supabase" }
supabase-storage = { group = "io.github.jan-tennert.supabase", name = "storage-kt", version.ref = "supabase" }

# ==================== ML / AI ====================
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflow-lite" }
tensorflow-lite-support = { group = "org.tensorflow", name = "tensorflow-lite-support", version.ref = "tensorflow-lite-support" }

# ==================== IMAGE LOADING ====================
# NOTE: Coil 3.x renamed its group from io.coil-kt to io.coil-kt.coil3 so v2
# and v3 can coexist. coil-network-okhttp is required for loading images from
# the network — coil-core no longer includes it by default in Coil 3.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# ==================== ACCOMPANIST ====================
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
accompanist-systemui = { group = "com.google.accompanist", name = "accompanist-systemuicontroller", version.ref = "accompanist" }
accompanist-navigation = { group = "com.google.accompanist", name = "accompanist-navigation-animation", version.ref = "accompanist" }

# ==================== TESTING ====================
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-ui = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version = "2.0.21-1.0.27" }
