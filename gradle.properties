# ============================================================================
# KATE ANDROID - GRADLE PROPERTIES
# ============================================================================
# Optimized for: Kotlin, Compose, TFLite
# ============================================================================

# ============================================================================
# ANDROID BUILD
# ============================================================================
android.useAndroidX=true
android.enableJetifier=false
android.bundle.suppressUnsupportedCompileSdk=35
android.experimental.enableNewResourceShrinker=true
# NOTE: android.defaults.buildfeatures.buildconfig removed — it's deprecated
# and disappears in AGP 9.0. buildConfig is already enabled properly via
# buildFeatures { buildConfig = true } inside app/build.gradle.kts.

# Enable AndroidX Compose compiler metrics
# android.compose.compiler.reportDestination=build/compose_metrics
# android.compose.compiler.metricsDestination=build/compose_metrics

# ============================================================================
# GRADLE PERFORMANCE
# ============================================================================
# Max heap size - 4GB recommended for large projects with NDK
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Parallel builds for multi-module projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# Use configuration cache for faster builds
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ============================================================================
# KOTLIN
# ============================================================================
kotlin.code.style=official
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
kotlin.caching.enabled=true

# Kotlin compiler daemon - larger heap for large projects
kotlin.daemon.jvmargs=-Xmx4096m

# Enable Kotlin compiler warnings as errors (optional - for quality)
# kotlin.compiler.warnings-as-errors=true

# ============================================================================
# KSP (Kotlin Symbol Processing) - for Room, Hilt
# ============================================================================
ksp.incremental=true
ksp.incremental.log=true

# ============================================================================
# COMPOSE
# ============================================================================
# Enable Compose compiler metrics
android.compose.compiler.reportDestination=build/compose_metrics
android.compose.compiler.metricsDestination=build/compose_metrics

# ============================================================================
# NDK (Native Development Kit)
# ============================================================================
# Use specific NDK version
android.ndkVersion=26.3.11579264

# Configure CMake
android.cmake.install=3.22.1

# Enable NDK build caching
android.cache.dynamicFeatures.enabled=true

# ============================================================================
# DEX / MULTIDEX
# ============================================================================
# NOTE: android.enableD8.desugaring removed — it was removed in AGP 7.0.
# D8 desugaring is applied automatically when applicable; the flag is dead
# and does nothing on AGP 8.7.2.

# ============================================================================
# DEBUGGING
# ============================================================================
# Enable detailed Gradle logging (uncomment for debugging)
# org.gradle.logging.level=info

# Print stack traces for build failures
org.gradle.internal.launcher.welcomeMessageDisplayed=false

# ============================================================================
# DEPENDENCY RESOLUTION
# ============================================================================
# Use strict dependency resolution (uncomment for production)
# org.gradle.dependency.verification.console=verbose
# org.gradle.dependency.verification.policy=strict

# ============================================================================
# SYSTEM PROPERTIES
# ============================================================================
# System properties for tests
systemProp.socks.proxyHost=
systemProp.socks.proxyPort=

# ============================================================================
# GRADLE DAEMON
# ============================================================================
# Keep daemon alive between builds (2 hours). NOTE: gradle.properties does not
# support inline "# comment" text after a value on the same line — the parser
# reads everything after "=" as the literal value, which breaks int parsing.
# Keep comments like this on their own line instead.
org.gradle.daemon.idletimeout=7200000

# ============================================================================
# FILE ENCODING
# ============================================================================
# Ensure UTF-8 encoding everywhere
file.encoding=UTF-8

# ============================================================================
# NETWORK
# ============================================================================
# Network timeout tuning for Gradle dependency downloads
systemProp.http.keepAlive=true
systemProp.http.maxConnections=20
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000

# ============================================================================
# PERFORMANCE MONITORING
# ============================================================================
# Enable build scans (uncomment to upload build scans)
# org.gradle.build.scans.publish=true
